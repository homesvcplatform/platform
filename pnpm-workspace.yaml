packages:
  - "apps/*"
  - "packages/*"
  - "packages/modules/*"
  - "packages/adapters/*"
# pnpm 10 blocks dependency lifecycle scripts by default; keep the allowlist explicit and empty.
onlyBuiltDependencies: []
# Supply-chain hardening:
# - minimumReleaseAge: don't resolve versions published less than 7 days ago (minutes).
# - trustPolicy: refuse a version whose publishing trust evidence is weaker than earlier versions'.
# - blockExoticSubdeps: transitive dependencies may only come from the registry (no git/tarball URLs).
minimumReleaseAge: 10080
trustPolicy: no-downgrade
blockExoticSubdeps: true
# Transitive pin (Gate 2): vite 8.3.0 accepts rolldown ~1.2.6. The Gate 1 lockfile had resolved rolldown 1.2.13,
# published one day earlier, which violates ADR-022 #3 (versions >= 2 weeks old) and minimumReleaseAge above.
# 1.2.11 (2026-09-24) satisfies both. Remove when Dependabot proposes a mature vite/rolldown pair.
# Transitive pin (Gate 5): graphile-worker 0.18.0 -> graphile-config asks for @types/node ^22.16.3, which resolves to
# 22.20.5 -> undici-types 6.21.0, refused by trustPolicy above (no provenance while earlier versions had it). Types
# only: pin graphile-config's @types/node to the repository's own Node 24 types (24.13.6), which pass the trust check.
# The trust policy itself is unchanged. Remove when graphile-config widens its range or the types publish with provenance.
overrides:
  rolldown: 1.2.11
  graphile-config>@types/node: 24.13.6
